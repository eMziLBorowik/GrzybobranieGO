<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zbieranie Lasu</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    height:100%;
}

#map{
    height:100vh;
    width:100%;
}

.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:12px;
    border-radius:12px;
    box-shadow:0 0 10px #555;
}

button{
    padding:10px 20px;
    font-size:16px;
}

#status{
    margin-top:8px;
}

</style>

</head>

<body>


<div class="panel">

<button id="startBtn">
START
</button>

<div id="status">
Pobieranie GPS...
</div>

</div>


<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>



<script>


// MAPA

const map = L.map('map')
.setView([52.2297,21.0122],15);



L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);




// ZMIENNE GPS

let userMarker=null;

let userLat=null;
let userLng=null;

let gpsWatch=null;

let tracking=false;




// WARSTWY

const forestLayer =
L.layerGroup().addTo(map);


const exploredLayer =
L.layerGroup().addTo(map);



// LASY Z OSM

let forests=[];




// PRZEJŚCIE

let path=[];


const line =
L.polyline(
[],
{
weight:5
}
)
.addTo(map);




// ODKRYTE KOMÓRKI

const visited =
JSON.parse(
localStorage.getItem("visitedForest")
||
"{}"
);





// POBIERANIE LASÓW Z OSM


async function loadForests(lat,lng){


document.getElementById("status")
.innerHTML="🌲 Pobieranie lasów...";



const query=`

[out:json];

way["landuse"="forest"]
(around:5000,${lat},${lng});

out geom;

`;



try{


const response =
await fetch(
"https://overpass-api.de/api/interpreter?data="
+
encodeURIComponent(query)
);



const data =
await response.json();




data.elements.forEach(
forest=>{


if(!forest.geometry)
return;



let points=[];


forest.geometry.forEach(
p=>{


points.push(
[
p.lat,
p.lon
]
);


});



if(points.length<3)
return;




// RYSOWANIE LASU


L.polygon(
points,
{
color:"green",
fillColor:"green",
fillOpacity:0.2,
weight:1
}
)
.addTo(forestLayer);





// GEOJSON DO SPRAWDZANIA GPS


try{


let poly =
turf.polygon(
[
points.map(
p=>[
p[1],
p[0]
]
)
]
);


forests.push(poly);



}catch(e){}



});


document.getElementById("status")
.innerHTML=
"🌲 Lasy gotowe";



console.log(
"Załadowano lasów:",
forests.length
);



}
catch(e){


console.log(e);


document.getElementById("status")
.innerHTML=
"❌ Błąd lasów";


}


}






// SPRAWDZANIE CZY W LESIE


function inForest(lat,lng){


let point =
turf.point(
[
lng,
lat
]
);



for(let f of forests){


if(
turf.booleanPointInPolygon(
point,
f
)
)
return true;


}


return false;


}






// GPS START


function startGPS(){


navigator.geolocation.watchPosition(

pos=>{


userLat =
pos.coords.latitude;


userLng =
pos.coords.longitude;



if(!userMarker){


userMarker =
L.marker(
[
userLat,
userLng
]
)
.addTo(map)
.bindPopup(
"📍 Ty"
);


map.setView(
[
userLat,
userLng
],
17
);



loadForests(
userLat,
userLng
);



}
else{


userMarker.setLatLng(
[
userLat,
userLng
]
);


}



if(tracking){


path.push(
[
userLat,
userLng
]
);


line.setLatLngs(
path
);



explore(
userLat,
userLng
);



}



if(
inForest(
userLat,
userLng
)
){


document.getElementById("status")
.innerHTML=
"🌲 Jesteś w lesie";


}
else{


document.getElementById("status")
.innerHTML=
"🏠 Poza lasem";


}



},


err=>{


document.getElementById("status")
.innerHTML=
"❌ Brak GPS";


},


{

enableHighAccuracy:true,

maximumAge:0,

timeout:30000

}


);


}






startGPS();





// PRZYCISK START


document.getElementById("startBtn")
.onclick=function(){


tracking=!tracking;


this.innerHTML =
tracking
?
"STOP"
:
"START";


};
// ===============================
// ODKRYWANIE LASU
// ===============================


function forestCellId(lat,lng){


const size=0.0001;


return (
Math.floor(lat/size)
+
"_"
+
Math.floor(lng/size)
);


}





function explore(lat,lng){


if(!inForest(lat,lng))
return;



const id =
forestCellId(
lat,
lng
);



if(visited[id])
return;



visited[id]=true;



localStorage.setItem(
"visitedForest",
JSON.stringify(visited)
);



drawExploredCell(
lat,
lng
);



}





function drawExploredCell(lat,lng){



const size=0.0001;


const lat1 =
Math.floor(lat/size)*size;


const lng1 =
Math.floor(lng/size)*size;




L.rectangle(
[
[lat1,lng1],
[
lat1+size,
lng1+size
]
],
{

color:"#006600",

fillColor:"#00ff00",

fillOpacity:0.45,

weight:1

}

)
.addTo(exploredLayer);



}






// ODTWARZANIE ODKRYTYCH MIEJSC PO PONOWNYM WEJŚCIU


function loadExplored(){


Object.keys(visited)
.forEach(id=>{


const p =
id.split("_")
.map(Number);



const size=0.0001;



L.rectangle(
[
[
p[0]*size,
p[1]*size
],

[
p[0]*size+size,
p[1]*size+size
]

],
{

color:"#006600",

fillColor:"#00ff00",

fillOpacity:0.45,

weight:1

}

)
.addTo(exploredLayer);



});


}



loadExplored();




// LICZNIK ODKRYCIA


function exploredCount(){


return Object.keys(visited).length;


}



console.log(
"Odkryte pola lasu:",
exploredCount()
);



// ===============================
// KONIEC
// ===============================
