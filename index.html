function cellId(lat,lng){

const size=0.0001;

return (
Math.floor(lat/size)
+
"_"
+
Math.floor(lng/size)
);

}




function drawCell(lat,lng){

const size=0.0001;


const lat1 =
Math.floor(lat/size)*size;


const lng1 =
Math.floor(lng/size)*size;


const id =
cellId(lat,lng);



if(visitedCells[id])
return;



visitedCells[id]=true;


localStorage.setItem(
"visitedCells",
JSON.stringify(visitedCells)
);



L.rectangle(
[
[lat1,lng1],
[lat1+size,lng1+size]
],
{
color:"#00aa00",
fillColor:"#00ff00",
fillOpacity:0.4,
weight:1
}
)
.addTo(gridLayer);



}

[

function startGPS(){


// NOWA FUNKCJA GPS DZIAŁAJĄCA NA TELEFONIE

function getUserLocation(){

if(!navigator.geolocation){

alert("Twoje urządzenie nie obsługuje GPS");
return;

}


navigator.geolocation.watchPosition(

function(pos){
pos=>{

let lng = pos.coords.longitude;
