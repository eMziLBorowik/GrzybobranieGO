<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Niezbędnik Grzybiarza</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


html,body{
margin:0;
height:100%;
background:#1b2417;
}



/* MAPA */

#map{

position:absolute;

top:90px;
bottom:70px;

left:10px;
right:10px;

border-radius:20px;

overflow:hidden;

box-shadow:0 0 20px black;

}



/* GÓRA */

.panel{

position:absolute;

top:0;
left:0;

width:100%;
height:90px;

z-index:2000;


background:
linear-gradient(
135deg,
#203719,
#557a32
);


color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:10px 15px;

border-bottom:3px solid #a57a32;

}



.logo{

font-size:21px;

font-weight:bold;

}



.subtitle{

font-size:12px;

color:#ddd;

}



#forestStatus{

background:#162013;

padding:8px;

border-radius:12px;

font-size:12px;

}




button{

background:#6b8f3d;

border:0;

color:white;

padding:10px 15px;

border-radius:15px;

font-size:14px;

}




/* DÓŁ */


.bottomMenu{

position:absolute;

bottom:0;

left:0;

height:70px;

width:100%;

z-index:2000;

background:#172014;

border-top:3px solid #a57a32;


display:flex;

justify-content:space-around;

align-items:center;

color:white;

}



.bottomMenu div{

text-align:center;

font-size:12px;

}



.icon{

font-size:25px;

display:block;

}



</style>


</head>


<body>



<div class="panel">


<div>

<div class="logo">
🍄 Niezbędnik Grzybiarza
</div>

<div class="subtitle">
Twoja mapa odkrywania lasów
</div>

</div>


<div id="forestStatus">
📡 GPS...
</div>


<button id="toggleBtn">
START
</button>


</div>



<div id="map"></div>



<div class="bottomMenu">


<div>
<span class="icon">🗺</span>
Mapa
</div>


<div>
<span class="icon">🌲</span>
Lasy
</div>


<div>
<span class="icon">🍄</span>
Grzyby
</div>


<div>
<span class="icon">⚙</span>
Opcje
</div>


</div>




<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>



<script>


const map = L.map('map')
.setView([52.2297,21.0122],15);



L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);



let userMarker=null;

let userLat=null;

let userLng=null;


let tracking=false;

let watchId=null;



const path=[];


const visitedCells =
JSON.parse(
localStorage.getItem("visitedCells") || "{}"
);



const gridLayer =
L.layerGroup().addTo(map);



const forestLayer =
L.layerGroup().addTo(map);



let forests=[];



const polyline =
L.polyline([],{

weight:5

})
.addTo(map);






function cellId(lat,lng){

const size=0.0001;

return (

Math.floor(lat/size)

+

"_"

+

Math.floor(lng/size)

);

}




function drawCell(lat,lng){


const size=0.0001;


const lat1 =
Math.floor(lat/size)*size;


const lng1 =
Math.floor(lng/size)*size;



const id =
cellId(lat,lng);



if(visitedCells[id])
return;



visitedCells[id]=true;


localStorage.setItem(
"visitedCells",
JSON.stringify(visitedCells)
);



L.rectangle(

[
[lat1,lng1],
[lat1+size,lng1+size]
],

{

color:"#2ecc40",

fillColor:"#00ff00",

fillOpacity:.35,

weight:1

}

)

.addTo(gridLayer);



}







async function loadForests(lat,lng){


try{


const query=`

[out:json];

way["landuse"="forest"]
(around:5000,${lat},${lng});

out geom;

`;



const url=

"https://overpass-api.de/api/interpreter?data="

+

encodeURIComponent(query);



const response =
await fetch(url);



const data =
await response.json();




data.elements.forEach(forest=>{


if(!forest.geometry)
return;



let points=[];



forest.geometry.forEach(p=>{


points.push(
[
p.lat,
p.lon
]
);


});



if(points.length<3)
return;



L.polygon(

points,

{

color:"green",

fillColor:"green",

fillOpacity:.25,

weight:1

}

)

.addTo(forestLayer);





try{


forests.push(

turf.polygon(

[

points.map(p=>[

p[1],

p[0]

])

]

)

);



}catch(e){}



});



document.getElementById(
"forestStatus"
).innerHTML="🌲 Lasy gotowe";



}catch(e){


document.getElementById(
"forestStatus"
).innerHTML="❌ Błąd lasów";


}



}






function checkForest(lat,lng){


if(!forests.length)
return;



let point=turf.point(
[
lng,
lat
]
);



let inside=false;



for(let f of forests){


if(
turf.booleanPointInPolygon(
point,
f
)
){

inside=true;
break;

}


}



document.getElementById(
"forestStatus"
).innerHTML=

inside

?

"🌲 Jesteś w lesie"

:

"🏠 Poza lasem";



}







function getUserLocation(){


navigator.geolocation.watchPosition(

pos=>{


userLat=pos.coords.latitude;

userLng=pos.coords.longitude;



if(!userMarker){


userMarker=L.marker(
[userLat,userLng]
)

.addTo(map)

.bindPopup(
"📍 Twoja lokalizacja"
);



map.setView(
[userLat,userLng],
16
);



}else{


userMarker.setLatLng(
[userLat,userLng]
);


}




if(!forests.length)

loadForests(
userLat,
userLng
);



},

err=>{


document.getElementById(
"forestStatus"
).innerHTML=
"❌ GPS";


},

{

enableHighAccuracy:true,

timeout:30000,

maximumAge:0

}



);


}



getUserLocation();








document.getElementById(
"toggleBtn"
)

.onclick=function(){


tracking=!tracking;



this.innerHTML=

tracking

?

"STOP"

:

"START";





if(tracking){



watchId=

navigator.geolocation.watchPosition(

pos=>{


let lat=pos.coords.latitude;

let lng=pos.coords.longitude;



const point=[lat,lng];


path.push(point);


polyline.setLatLngs(
path
);



if(userMarker)

userMarker.setLatLng(
point
);



map.setView(
point,
18
);



drawCell(
lat,
lng
);



checkForest(
lat,
lng
);



},


null,


{

enableHighAccuracy:true,

timeout:10000

}



);



}

else{


navigator.geolocation.clearWatch(
watchId
);


}



}



</script>



</body>
</html>
