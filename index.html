<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grzybiarz PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}
html,body{margin:0;height:100%;background:#1b2417;}

/* MAPA */
#map{
position:absolute;
top:90px;
bottom:120px;
left:10px;
right:10px;
border-radius:18px;
overflow:hidden;
}

/* PANEL GÓRNY */
.panel{
position:absolute;
top:0;left:0;width:100%;height:90px;
z-index:2000;
background:linear-gradient(135deg,#203719,#557a32);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
border-bottom:3px solid #a57a32;
}

#forestStatus{
background:#162013;
padding:8px;
border-radius:12px;
font-size:12px;
max-width:160px;
}

/* ACTION BAR */
#actionBar{
position:absolute;
bottom:75px;
left:10px;
right:10px;
z-index:2000;
display:flex;
justify-content:center;
}

button{
background:#6b8f3d;
border:0;
color:white;
padding:12px 18px;
border-radius:18px;
}

/* BOTTOM */
.bottomMenu{
position:absolute;
bottom:0;
left:0;
width:100%;
height:70px;
background:#172014;
border-top:3px solid #a57a32;
display:flex;
justify-content:space-around;
align-items:center;
color:white;
z-index:2000;
}

/* PANEL LASU */
#forestInfoPanel{
display:none;
position:absolute;
top:90px;
left:10px;
right:10px;
background:#162013;
color:white;
padding:12px;
border-radius:15px;
z-index:3000;
}

/* GRZYBDEX */
#grzybdex{
display:none;
position:absolute;
top:90px;
bottom:70px;
left:10px;
right:10px;
background:#1b2417;
color:white;
padding:15px;
overflow:auto;
}
.card{
background:#162013;
padding:10px;
border-radius:12px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="panel">
<div>
<div style="font-weight:bold;font-size:18px;">🍄 Grzybiarz PRO</div>
<div style="font-size:12px;color:#ddd;">OSM + AI + statystyki</div>
</div>

<div id="forestStatus">📡 GPS...</div>
</div>

<div id="map"></div>

<!-- GRZYB BUTTON -->
<div id="actionBar">
<button id="addMushroomBtn">🍄 Dodaj Znalezisko</button>
</div>

<!-- LAS INFO -->
<div id="forestInfoPanel">
<div id="forestName">🌲 Las</div>
<div id="forestRain">🌧️ Opady</div>
<div id="forestChance">🍄 Szansa</div>
</div>

<!-- GRZYBDEX -->
<div id="grzybdex">
<h2>🧠 GrzybDex</h2>

<div class="card">
📊 Statystyki:
<div id="stats"></div>
</div>

<div class="card">
⚠️ Ostrzeżenia:
<div id="warnings"></div>
</div>
</div>

<!-- MENU -->
<div class="bottomMenu">
<div id="tabMap">🗺 Mapa</div>
<div>🌲 Lasy</div>
<div id="tabDex">🍄 GrzybDex</div>
<div>⚙</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<script>

const map=L.map("map").setView([52.2,21.0],15);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
attribution:"© OSM"
}).addTo(map);

let userLat=null,userLng=null;
let userMarker=null;

let forests=[];
let mushrooms=JSON.parse(localStorage.getItem("mushrooms")||"[]");

function save(){
localStorage.setItem("mushrooms",JSON.stringify(mushrooms));
}

/* =====================
   LASY
===================== */
async function loadForests(lat,lng){

const q=`
[out:json];
(
way["landuse"="forest"](around:5000,${lat},${lng});
way["natural"="wood"](around:5000,${lat},${lng});
relation["landuse"="forest"](around:5000,${lat},${lng});
);
out geom;
`;

const url="https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q);

const res=await fetch(url);
const data=await res.json();

data.elements.forEach(el=>{

if(!el.geometry) return;

const pts=el.geometry.map(p=>[p.lat,p.lon]);
if(pts.length<3) return;

const poly=L.polygon(pts,{
color:"green",
fillOpacity:0.25
}).addTo(map);

poly.on("click",()=>showForest(el,pts));

try{
forests.push(turf.polygon([pts.map(p=>[p[1],p[0]])]));
}catch(e){}
});

document.getElementById("forestStatus").innerText="🌲 Lasy gotowe";
}

/* =====================
   GPS
===================== */
navigator.geolocation.watchPosition(pos=>{

userLat=pos.coords.latitude;
userLng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([userLat,userLng]).addTo(map);
map.setView([userLat,userLng],16);
}else{
userMarker.setLatLng([userLat,userLng]);
}

if(!forests.length) loadForests(userLat,userLng);

checkForest();

});

/* =====================
   GRZYBY
===================== */
document.getElementById("addMushroomBtn").onclick=function(){

if(!userLat||!userLng) return;

mushrooms.push({
lat:userLat,
lng:userLng,
time:Date.now()
});

save();

L.marker([userLat,userLng],{
icon:L.divIcon({html:"🍄"})
}).addTo(map);

updateStats();
};

/* =====================
   LAS INFO + AI
===================== */
async function getRain7d(lat,lng){
const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=precipitation_sum&past_days=7&timezone=auto`;
const r=await fetch(url);
const d=await r.json();
return (d.daily?.precipitation_sum||[]).reduce((a,b)=>a+(b||0),0);
}

async function getTemp(lat,lng){
const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m`;
const r=await fetch(url);
const d=await r.json();
return d.current?.temperature_2m||10;
}

function chance(rain,temp){
let c=0;
if(rain>30)c+=50;
else if(rain>15)c+=35;
else c+=20;

if(temp>=10&&temp<=20)c+=40;
else c+=10;

return Math.min(100,c);
}

async function showForest(el,pts){

let name="🌲 Las bez nazwy";
if(el.tags?.name) name="🌲 "+el.tags.name;

document.getElementById("forestInfoPanel").style.display="block";
document.getElementById("forestName").innerText=name;

const lat=pts[0][0];
const lng=pts[0][1];

document.getElementById("forestRain").innerText="🌧️ Liczenie...";
document.getElementById("forestChance").innerText="🍄 Liczenie...";

const rain=await getRain7d(lat,lng);
const temp=await getTemp(lat,lng);

document.getElementById("forestRain").innerText="🌧️ Opady: "+rain.toFixed(1)+" mm";
document.getElementById("forestChance").innerText="🍄 Szansa: "+chance(rain,temp)+"%";
}

/* =====================
   CHECK LAS
===================== */
function checkForest(){

if(!forests.length||!userLat) return;

const pt=turf.point([userLng,userLat]);

let inside=false;

forests.forEach(f=>{
if(turf.booleanPointInPolygon(pt,f)) inside=true;
});

document.getElementById("forestStatus").innerText=
inside?"🌲 Jesteś w lesie":"🏠 Poza lasem";
}

/* =====================
   GRZYBDEX
===================== */
document.getElementById("tabDex").onclick=()=>{
document.getElementById("map").style.display="none";
document.getElementById("grzybdex").style.display="block";
updateStats();
};

document.getElementById("tabMap").onclick=()=>{
document.getElementById("map").style.display="block";
document.getElementById("grzybdex").style.display="none";
};

function updateStats(){
document.getElementById("stats").innerText="🍄 "+mushrooms.length+" znalezisk";
document.getElementById("warnings").innerText=
mushrooms.length>5?"⚠️ Dużo grzybów – uważaj na gatunki":"Brak zagrożeń";
}
updateStats();

</script>

</body>
</html>
