
<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grzybiarz PRO</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<!-- GÓRNY PANEL -->
<div class="panel">

<div>

<div class="title">
🍄 Grzybiarz PRO
</div>

<div class="sub">
AI + lasy + GPS
</div>

</div>

<div id="forestStatus">
📡 GPS...
</div>

</div>

<!-- MAPA -->
<div id="map"></div>

<!-- DODAJ GRZYBA -->
<div id="actionBar">

<button id="addMushroomBtn">
🍄 Dodaj Znalezisko
</button>

</div>

<!-- INFORMACJE O LESIE -->
<div id="forestInfoPanel">

<div id="forestName">🌲 Las</div>
<div id="forestRain">🌧️ Opady</div>
<div id="forestChance">🍄 Szansa</div>

</div>

<!-- 🍄 GRZYBDEX -->
<div id="grzybdex">

<h2>🧠 GrzybDex AI</h2>

<div class="card">

📸 Skanuj grzyba aparatem

<br><br>

<button id="scanBtn">📸 Skanuj grzyba</button>

<input
type="file"
id="cameraInput"
accept="image/*"
capture="environment"
hidden
>

<br><br>

<div id="scanResult">
Brak skanu
</div>

</div>

<h2>🍄 Atlas odkryć</h2>

<div id="atlas"></div>

<div class="card">

📊 Statystyki
<div id="stats"></div>

</div>

<div class="card">

⚠️ Ostrzeżenia
<div id="warnings"></div>

</div>

</div>

<!-- DOLNE MENU -->
<div class="bottomMenu">

<div id="tabMap">🗺 Mapa</div>

<div>🌲 Lasy</div>

<div id="tabDex">🍄 GrzybDex</div>

<div>⚙</div>

</div>

<!-- BIBLIOTEKI -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<!-- TWOJE PLIKI -->
<script src="js/map.js?v=2"></script>
<script src="js/weather.js?v=2"></script>
<script src="js/forests.js?v=2"></script>
<script src="js/mushrooms.js?v=2"></script>
<script src="js/grzybdex.js?v=2"></script>
<script src="js/stats.js?v=2"></script>
<script src="js/app.js?v=2"></script>

</body>

</html>
