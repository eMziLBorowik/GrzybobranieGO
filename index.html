<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niezbędnik Grzybiarza PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}
html,body{margin:0;height:100%;background:#1b2417;}

/* MAPA */
#map{
position:absolute;
top:90px;
bottom:120px;
left:10px;
right:10px;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 20px black;
}

/* PANEL GÓRNY */
.panel{
position:absolute;
top:0;left:0;width:100%;height:90px;
z-index:2000;
background:linear-gradient(135deg,#203719,#557a32);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
border-bottom:3px solid #a57a32;
}

#forestStatus{
background:#162013;
padding:8px;
border-radius:12px;
font-size:12px;
max-width:150px;
}

/* DÓŁ */
.bottomMenu{
position:absolute;
bottom:0;left:0;height:70px;width:100%;
z-index:2000;
background:#172014;
border-top:3px solid #a57a32;
display:flex;
justify-content:space-around;
align-items:center;
color:white;
}

.icon{font-size:22px;display:block;text-align:center;}

/* ACTION BAR */
#actionBar{
position:absolute;
bottom:75px;
left:10px;
right:10px;
z-index:2000;
display:flex;
justify-content:center;
}

#addMushroomBtn{
background:#6b8f3d;
color:white;
border:0;
padding:12px 18px;
border-radius:18px;
box-shadow:0 0 10px black;
}

/* GRZYBDEX */
#grzybdex{
display:none;
position:absolute;
top:90px;
bottom:70px;
left:10px;
right:10px;
background:#1b2417;
color:white;
padding:15px;
overflow:auto;
border-radius:20px;
}
.card{
background:#162013;
padding:10px;
border-radius:12px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="panel">
<div>
<div style="font-size:18px;font-weight:bold;">🍄 Grzybiarz PRO</div>
<div style="font-size:12px;color:#ddd;">AI + mapa lasów</div>
</div>

<div id="forestStatus">📡 GPS...</div>
</div>

<div id="map"></div>

<!-- ACTION BAR -->
<div id="actionBar">
<button id="addMushroomBtn">🍄 Dodaj Znalezisko</button>
</div>

<!-- GRZYBDEX -->
<div id="grzybdex">

<h2>🧠 GrzybDex AI</h2>

<div class="card">
📸 Rozpoznawanie grzybów (demo AI)
<br><br>
<input type="file" id="img">
<button onclick="fakeAI()">Rozpoznaj</button>
<div id="aiResult"></div>
</div>

<div class="card">
📊 Statystyki
<div id="stats"></div>
</div>

<div class="card">
⚠️ Ostrzeżenia
<div id="warnings">Brak danych</div>
</div>

</div>

<!-- BOTTOM MENU -->
<div class="bottomMenu">
<div id="tabMap"><span class="icon">🗺</span>Mapa</div>
<div><span class="icon">🌲</span>Lasy</div>
<div id="tabGrzyb"><span class="icon">🍄</span>GrzybDex</div>
<div><span class="icon">⚙</span>Opcje</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<script>

const map=L.map("map").setView([52.2297,21.0122],15);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
attribution:"© OSM"
}).addTo(map);

let userLat=null,userLng=null;
let userMarker=null;

let forests=[];
let mushrooms=JSON.parse(localStorage.getItem("mushrooms")||"[]");

function save(){
localStorage.setItem("mushrooms",JSON.stringify(mushrooms));
}

/* ======================
   LASY
====================== */
async function loadForests(lat,lng){

const q=`
[out:json];
(
way["landuse"="forest"](around:5000,${lat},${lng});
way["natural"="wood"](around:5000,${lat},${lng});
relation["landuse"="forest"](around:5000,${lat},${lng});
);
out geom;
`;

const url="https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q);

const res=await fetch(url);
const data=await res.json();

data.elements.forEach(el=>{
if(!el.geometry) return;

const pts=el.geometry.map(p=>[p.lat,p.lon]);
if(pts.length<3) return;

L.polygon(pts,{color:"green",fillOpacity:0.25}).addTo(map);

try{
forests.push(turf.polygon([pts.map(p=>[p[1],p[0]])]));
}catch(e){}
});

document.getElementById("forestStatus").innerText="🌲 Lasy gotowe";
}

/* ======================
   GPS
====================== */
navigator.geolocation.watchPosition(pos=>{

userLat=pos.coords.latitude;
userLng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([userLat,userLng]).addTo(map);
map.setView([userLat,userLng],16);
}else{
userMarker.setLatLng([userLat,userLng]);
}

if(!forests.length) loadForests(userLat,userLng);

checkForest();

});

/* ======================
   GRZYBY
====================== */
document.getElementById("addMushroomBtn").onclick=function(){

if(!userLat||!userLng) return;

const m={
lat:userLat,
lng:userLng,
time:Date.now()
};

mushrooms.push(m);
save();

L.marker([m.lat,m.lng],{
icon:L.divIcon({html:"🍄"})
}).addTo(map);

updateStats();

document.getElementById("forestStatus").innerText="🍄 Dodano grzyba";
};

/* ======================
   CHECK LAS
====================== */
function checkForest(){

if(!forests.length||!userLat) return;

const pt=turf.point([userLng,userLat]);

let inside=false;

forests.forEach(f=>{
if(turf.booleanPointInPolygon(pt,f)) inside=true;
});

document.getElementById("forestStatus").innerText=
inside?"🌲 Jesteś w lesie":"🏠 Poza lasem";
}

/* ======================
   GRZYBDEX
====================== */
document.getElementById("tabGrzyb").onclick=function(){
document.getElementById("map").style.display="none";
document.getElementById("grzybdex").style.display="block";
updateStats();
};

document.getElementById("tabMap").onclick=function(){
document.getElementById("map").style.display="block";
document.getElementById("grzybdex").style.display="none";
};

/* ======================
   AI DEMO
====================== */
function fakeAI(){

const types=["Borowik szlachetny","Podgrzybek brunatny","Muchomor czerwony ⚠️"];

const r=types[Math.floor(Math.random()*types.length)];

document.getElementById("aiResult").innerHTML=
"🧠 Wynik: "+r;
}

/* ======================
   STATYSTYKI
====================== */
function updateStats(){

document.getElementById("stats").innerHTML=
"🍄 Znaleziska: "+mushrooms.length;

let warn="Brak zagrożeń";
if(mushrooms.length>0) warn="Uważaj na podobne gatunki ⚠️";

document.getElementById("warnings").innerText=warn;

}
updateStats();

</script>

</body>
</html>
