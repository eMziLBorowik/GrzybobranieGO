<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grzybiarz PRO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="panel">
<div>
<div class="title">🍄 Grzybiarz PRO</div>
<div class="sub">AI + lasy + GPS</div>
</div>
<div id="forestStatus">📡 GPS...</div>
</div>

<div id="map"></div>

<div id="actionBar">

</div>

<div id="forestInfoPanel">
<div id="forestName">🌲 Las</div>
<div id="forestRain">🌧️ Opady</div>
<div id="forestChance">🍄 Szansa</div>
</div>

<div id="grzybdex">
<h2>🧠 GrzybDex AI</h2>


<div class="card">

📸 Skanuj grzyba aparatem

<br><br>


<input 
type="file"
id="cameraInput"
accept="image/*"
capture="environment">


<br><br>


<div id="aiResult">
Brak skanu
</div>


</div>



<h2>🍄 Atlas odkryć</h2>


<div id="atlas"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<script src="js/map.js"></script>
<script src="js/weather.js"></script>
<script src="js/forests.js"></script>
<script src="js/mushrooms.js"></script>

<script src="js/stats.js"></script>
